<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christian Daniel | Terminal Portfolio</title>
    <style>
        /* Menggunakan tema warna gelap khas Tokyo Night / Hacker */
        body {
            background-color: #1a1b26;
            color: #a9b1d6;
            font-family: 'Consolas', 'Fira Code', 'Courier New', Courier, monospace;
            padding: 20px;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Warna untuk prompt terminal */
        .user { color: #9ece6a; font-weight: bold; } /* Hijau */
        .dir { color: #7aa2f7; font-weight: bold; }  /* Biru */
        
        .output { 
            color: #c0caf5; 
            margin-bottom: 15px; 
            white-space: pre-wrap; 
        }
        
        .error { color: #f7768e; } /* Merah untuk error */
        .success { color: #9ece6a; } 

        #input-line {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
            margin-left: 8px;
            caret-color: #9ece6a; /* Warna kursor berkedip */
        }
    </style>
</head>
<body>
    <div class="container" id="terminal">
        <div class="output">
┌─────────────────────────────────────────────────────────┐
│ Welcome to Christian Daniel's Interactive Terminal OS   │
│ Type <span class="success">'help'</span> to see a list of available commands.        │
└─────────────────────────────────────────────────────────┘
        </div>
        
        <!-- Tempat untuk riwayat perintah yang sudah diketik -->
        <div id="history"></div>
        
        <!-- Baris input aktif -->
        <div id="input-line">
            <span class="user">guest@christian-daniel</span>:<span class="dir">~</span>$ 
            <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        const input = document.getElementById('cmd-input');
        const history = document.getElementById('history');

        // Daftar perintah dan outputnya
        const commands = {
            'help': 'Daftar perintah yang tersedia:\n  about    - Siapa Christian Daniel?\n  skills   - Keahlian teknis\n  projects - Portofolio proyek\n  contact  - Informasi kontak\n  clear    - Membersihkan layar terminal',
            
            'about': 'Halo! Saya Christian Daniel.\nSaya adalah seorang Web Developer & Tech Enthusiast yang gemar memecahkan masalah melalui baris kode.\nSaya berfokus pada pembuatan antarmuka web yang interaktif, cepat, dan modern.',
            
            'skills': '=== Technical Skills ===\n[+] Languages : HTML, CSS, JavaScript, Python, PHP\n[+] Frameworks: React, Node.js, Tailwind CSS, Laravel\n[+] Tools     : Git, Docker, Linux, Figma',
            
            'projects': '=== Recent Projects ===\n1. E-Commerce API (Node.js & MongoDB)\n2. Terminal Portfolio (HTML, CSS, JS)\n3. AI Chatbot Interface (React.js)',
            
            'contact': '=== Contact Information ===\nEmail    : contact@christiandaniel.com\nGitHub   : github.com/christiandaniel\nLinkedIn : linkedin.com/in/christiandaniel\nInstagram: @christian.daniel',
        };

        // Fungsi dijalankan setiap kali tombol ditekan
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                input.value = ''; // Kosongkan input

                // Format tampilan prompt yang diketik user
                const prompt = `<span class="user">guest@christian-daniel</span>:<span class="dir">~</span>$ ${cmd}`;
                let response = '';

                // Logika perintah
                if (cmd === 'clear') {
                    history.innerHTML = ''; // Hapus semua riwayat
                    return;
                } else if (cmd === '') {
                    response = '';
                } else if (cmd === 'sudo') {
                    response = `<span class="error">nice try, but you don't have root privileges!</span>`;
                } else if (commands[cmd]) {
                    response = commands[cmd];
                } else {
                    response = `<span class="error">bash: ${cmd}: command not found. Type 'help' for available commands.</span>`;
                }

                // Tambahkan perintah dan output ke riwayat
                const historyElement = document.createElement('div');
                historyElement.innerHTML = `<div>${prompt}</div><div class="output">${response}</div>`;
                history.appendChild(historyElement);
                
                // Auto scroll ke bawah
                window.scrollTo(0, document.body.scrollHeight);
            }
        });

        // Memastikan input selalu fokus meskipun user klik sembarangan di layar
        document.addEventListener('click', () => {
            input.focus();
        });
    </script>
</body>
</html>
